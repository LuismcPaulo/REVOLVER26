<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNORANCE IS A BLESSNG?</title>
<link rel="icon" href="images/pill.png">

<style>
html, body{
  margin:0;
  height:100%;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* imagem centrada */
.center-img{
  max-width: min(400px, 70vw);
  height:auto;
  animation: pulse 3s ease-in-out infinite;
  transition: filter 0.3s ease;
}

@keyframes pulse{
  0%{
    transform: scale(1);
    filter: drop-shadow(0 0 0px rgba(0,120,255,0.0));
  }
  50%{
    transform: scale(1.06);
    filter: drop-shadow(0 0 25px rgba(0,120,255,0.5));
  }
  100%{
    transform: scale(1);
    filter: drop-shadow(0 0 0px rgba(0,120,255,0.0));
  }
}
</style>
</head>

<body>

<img src="images/qrcode.png" class="center-img" alt="Blue Pill">

</body>
</html>
