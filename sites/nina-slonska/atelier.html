<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>atelier</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    cursor: none;
}

canvas {
    display: block;
}

#cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 25px;
    height: 25px;
    border: 2px solid #00ff44;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: difference;
    box-shadow: 0 0 25px #00ff44;
    transition: transform 0.1s ease-out, opacity 2.5s ease-in-out;
}

#cursor::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    background: #00ff44;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px #00ff44;
}
</style>
</head>
<body>
<div id="cursor"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const transitionState = localStorage.getItem("transition")
let blobSpawnSmall = (transitionState === "toBlob")

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000)
camera.position.z = 3.2

const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setPixelRatio(window.devicePixelRatio)
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

/* BLOB */
const geometry = new THREE.IcosahedronGeometry(0.75, 40)
const basePositions = geometry.attributes.position.array.slice()

const palette = [0x39ff14, 0xff1a1a, 0xff6a00, 0x8b4000, 0xb59b00]

let colorArray = new Float32Array(geometry.attributes.position.count * 3)
for(let i=0;i<geometry.attributes.position.count;i++){
    let hex = palette[Math.floor(Math.random()*palette.length)]
    let color = new THREE.Color(hex)
    let grain = Math.random()*0.3

    colorArray[i*3] = color.r*(1-grain)
    colorArray[i*3+1] = color.g*(1-grain)
    colorArray[i*3+2] = color.b*(1-grain)
}

geometry.setAttribute("color", new THREE.BufferAttribute(colorArray,3))

const material = new THREE.MeshStandardMaterial({
    roughness:0.5,
    metalness:0.2,
    flatShading:true,
    vertexColors:true,
    emissive:0x111111,
    emissiveIntensity:0.6
})

const blob = new THREE.Mesh(geometry, material)
scene.add(blob)

if(blobSpawnSmall) blob.scale.set(0.01,0.01,0.01)

/* LIGHTING */
scene.add(new THREE.AmbientLight(0xffffff,0.6))
const light = new THREE.PointLight(0x39ff14,3)
light.position.set(5,4,4)
scene.add(light)

/* CURSOR - EXATAMENTE IGUAL AO UNIVERSE */
let cursor = document.getElementById('cursor');
document.addEventListener("mousemove",e=>{
    cursor.style.left = (e.clientX - 12.5) + 'px';
    cursor.style.top = (e.clientY - 12.5) + 'px';
});

/* MOUSE PARA ROTACAO (mantém funcionalidade original) */
let mouse={x:0,y:0}
let targetRotation={x:0,y:0}

document.addEventListener("mousemove",e=>{
    mouse.x = e.clientX/window.innerWidth-0.5
    mouse.y = e.clientY/window.innerHeight-0.5
    targetRotation.y = mouse.x * Math.PI * 2
    targetRotation.x = mouse.y * Math.PI * 2
});

/* CLICK EVOLUTION */
let evolutionEnergy = 0
let displayedEnergy = 0
const MAX_ENERGY = 7
let converging = false
let convergenceProgress = 0

document.addEventListener("click",()=>{
    if(converging) return

    evolutionEnergy++
    evolutionEnergy = Math.min(evolutionEnergy, MAX_ENERGY)

    if(evolutionEnergy >= MAX_ENERGY){
        converging = true
    }
})

function animateConvergence(){
    convergenceProgress += 0.03
    convergenceProgress = Math.min(convergenceProgress,1)

    let posArr = geometry.attributes.position.array

    for(let i=0;i<posArr.length;i+=3){
        posArr[i]   += (0 - posArr[i]) * convergenceProgress
        posArr[i+1] += (0 - posArr[i+1]) * convergenceProgress
        posArr[i+2] += (0 - posArr[i+2]) * convergenceProgress
    }

    geometry.attributes.position.needsUpdate=true
    geometry.computeVertexNormals()

    if(convergenceProgress >= 1){
        setTimeout(()=>{
            localStorage.setItem("transition","toUniverse")
            window.location.href = "universe.html"
        }, 100)
    }
}

/* ANIMATE */
const clock = new THREE.Clock()

function animate(){
    requestAnimationFrame(animate)

    let t = clock.getElapsedTime()
    displayedEnergy += (evolutionEnergy - displayedEnergy)*0.05

    blob.rotation.y += (targetRotation.y - blob.rotation.y)*0.08
    blob.rotation.x += (targetRotation.x - blob.rotation.x)*0.08
    blob.rotation.z = Math.sin(t*0.2)*0.3

    if(blobSpawnSmall && !converging){
        blob.scale.lerp(new THREE.Vector3(1,1,1),0.05)
    }

    if(converging){
        animateConvergence()
    } else {
        let posArr = geometry.attributes.position.array

        for(let i=0;i<posArr.length;i+=3){
            let x = basePositions[i]
            let y = basePositions[i+1]
            let z = basePositions[i+2]

            let wave =
                Math.sin(x*3+t*1.2)+
                Math.cos(y*4+t)+
                Math.sin(z*5+t*0.7)

            let evolutionFactor = displayedEnergy * 0.1
            let mouseForce = Math.abs(mouse.x)+Math.abs(mouse.y)

            let amp = 0.05 + evolutionFactor + mouseForce*0.15
            let organic = wave + Math.sin(t+evolutionFactor*2)

            posArr[i]   = x + x*organic*amp
            posArr[i+1] = y + y*organic*amp
            posArr[i+2] = z + z*organic*amp
        }

        geometry.attributes.position.needsUpdate=true
        geometry.computeVertexNormals()
    }

    renderer.render(scene,camera)
}

animate()

window.addEventListener("resize",()=>{
    camera.aspect=window.innerWidth/window.innerHeight
    camera.updateProjectionMatrix()
    renderer.setSize(window.innerWidth,window.innerHeight)
})

localStorage.removeItem("transition")
</script>
</body>
</html>
