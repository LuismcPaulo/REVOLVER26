<!DOCTYPE html>
<html>
<head>
<title>even stranger</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/beetle.png">
</head>
<body>

<div class="image-container">
  <img src="images/3.jpg" alt="Background" class="background-image">
  <img id="beast" src="images/beast.png" alt="Beast Image" class="image">
  <img id="beastclose" src="images/beast2.png" alt="Beast Close Image" class="image" style="display: none;">
  <button id="buttonbeast" class="invisible-button" onclick="handleBeastClick()" aria-label="Button description"></button>
</div>

<!-- Speech bubble -->
<div id="speechbubble" class="speech-container" style="display: none;">
  <img src="images/speechbeast.png" alt="Speech Bubble" class="speech-image">
  <div id="speechtext" class="speech-text"></div>
</div>

<!-- Plaques container -->
<div id="plaques-container" style="display: none;">
  <!-- Face the Beast plaque -->
  <div id="plaque-fight" class="plaque-container" onclick="goToFight()">
    <img src="images/plaque.png" alt="Plaque" class="plaque-image">
    <div class="plaque-text">Face the Beast</div>
  </div>
  
  <!-- Go Home plaque -->
  <div id="plaque-home" class="plaque-container" onclick="goHome()">
    <img src="images/plaque.png" alt="Plaque" class="plaque-image">
    <div class="plaque-text">Go Home</div>
  </div>
</div>

<!-- Audio element -->
<audio id="backgroundMusic" autoplay loop muted preload="auto">
  <source src="audio/instrumentalcave.mp3" type="audio/mpeg">
</audio>

<script>
// Dialogue arrays based on visit count
const dialogueCycles = {
  firstTime: [
    "Who dares enter my cave... oh, it's another one of you.",
    "You've come for the treasure too I assume…",
    "Many have tried and all have failed, and so will you.",
    "All of you little pretentious creatures… all you do is take and take, until there is nothing left.",
    "Your greed is a disease, and all of you spread it through this earth like a plague.",
    "Do you wish to kill me? I, who has been walking the earth before the first of your kind was even born?",
    "Will you take your turn to swing your sword at me, joining the ones before you, or will you go back home to tell your fake tale of bravery?",
    "Will you take your turn to swing your sword at me, joining the ones before you, or will you go back home to tell your fake tale of bravery?"
  ],
  
  secondToFourth: [
    "You again…",
    "Haven't you suffered enough?",
    "Perhaps not.",
    "Perhaps not."
  ],
  
  fifthToNinth: [
    "Aren't you tired, petty human?"
  ],
  
  tenthToInfinity: [
    "You don't seem to learn.",
    "The cycle of death is never ending and so is your suffering.",
    "Break the cycle.",
    "Look around.",
    "This means nothing.",
    "This means nothing.",
  ],
};

// Get or initialize visit count from sessionStorage (resets when browser is closed)
let visitCount = sessionStorage.getItem('beastVisitCount');
if (visitCount === null) {
  visitCount = 1;
} else {
  visitCount = parseInt(visitCount) + 1;
}
sessionStorage.setItem('beastVisitCount', visitCount);

// Determine which dialogue array to use based on visit count
let currentDialogue;

if (visitCount == 1) {
  currentDialogue = [...dialogueCycles.firstTime];
} else if (visitCount >= 2 && visitCount <= 4) {
  currentDialogue = [...dialogueCycles.secondToFourth];
} else if (visitCount >= 5 && visitCount <= 9) {
  currentDialogue = [...dialogueCycles.fifthToNinth];
} else {
  currentDialogue = [...dialogueCycles.tenthToInfinity];
}

let currentLineIndex = 0;
let dialogueStarted = false;

// Function to handle beast clicks
function handleBeastClick() {
  var beastNormal = document.getElementById("beast");
  var beastClose = document.getElementById("beastclose");
  var speechContainer = document.getElementById("speechbubble");
  var speechText = document.getElementById("speechtext");
  var plaquesContainer = document.getElementById("plaques-container");
  
  if (!dialogueStarted) {
    // First click: switch to close beast and start dialogue
    beastNormal.style.display = "none";
    beastClose.style.display = "block";
    
    // Show speech bubble with first line
    speechContainer.style.display = "block";
    speechText.textContent = currentDialogue[0];
    currentLineIndex = 1;
    dialogueStarted = true;
  } else {
    // Show next line if available
    if (currentLineIndex < currentDialogue.length) {
      speechText.textContent = currentDialogue[currentLineIndex];
      currentLineIndex++;
    }
    
    // Check if we've reached the end of dialogue
    if (currentLineIndex === currentDialogue.length) {
      // Hide speech bubble
      speechContainer.style.display = "none";
      
      // Show plaques after a short delay
      setTimeout(() => {
        plaquesContainer.style.display = "flex";
      }, 500);
    }
  }
}

// Function for fight plaque click
function goToFight() {
  window.location.href = "page5.html";
}

// Function for home plaque click
function goHome() {
  window.location.href = "page4.html";
}

// Background music settings
document.getElementById("backgroundMusic").volume = 0.06;

window.addEventListener('load', function() {
  var bgMusic = document.getElementById("backgroundMusic");
  
  setTimeout(function() {
    bgMusic.muted = false;
  }, 1000);
});

document.body.addEventListener('click', function unmute() {
  var bgMusic = document.getElementById("backgroundMusic");
  bgMusic.muted = false;
  document.body.removeEventListener('click', unmute);
}, { once: true });

</script>

</body>
</html>
