<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Disponível em breve — Aves da Amazónia</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --verde:#223108;
  --fundo:#fffbeb;
  --borda:rgba(0,0,0,0.08);
  --sombra:0 16px 34px rgba(0,0,0,0.10);
}

body{
  font-family:Inter, sans-serif;
  color:var(--verde);
  background:
    radial-gradient(circle at 15% 20%, rgba(90,120,60,0.08), transparent 55%),
    radial-gradient(circle at 85% 70%, rgba(60,100,40,0.07), transparent 60%),
    radial-gradient(circle at 50% 90%, rgba(80,110,60,0.05), transparent 65%),
    var(--fundo);
  min-height:100vh;
  overflow-x:hidden;
}

/* TOPO */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:34px 70px;
  font-size:16px;
  gap:20px;
}

.brand{
  font-weight:700;
}

.nav{
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
}

.link{
  text-decoration:none;
  color:var(--verde);
  opacity:0.85;
}

.btn-top{
  text-decoration:none;
  border:2px solid var(--verde);
  color:var(--verde);
  padding:10px 16px;
  border-radius:12px;
  font-weight:600;
  transition:all 0.25s ease;
}

.btn-top:hover{
  background:var(--verde);
  color:var(--fundo);
}

/* CONTEÚDO */

.wrapper{
  min-height:calc(100vh - 110px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px 70px;
}

.card{
  width:min(100%, 760px);
  background:rgba(255,255,255,0.92);
  border:1px solid var(--borda);
  border-radius:28px;
  box-shadow:var(--sombra);
  padding:48px 42px;
  text-align:center;
  backdrop-filter:blur(3px);
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  background:#eef3e2;
  font-size:13px;
  font-weight:700;
  letter-spacing:0.8px;
  text-transform:uppercase;
  margin-bottom:18px;
}

.title{
  font-family:"Playfair Display", serif;
  font-style:italic;
  font-size:clamp(40px, 7vw, 68px);
  line-height:0.96;
  margin-bottom:18px;
}

.text{
  font-size:18px;
  line-height:1.6;
  max-width:560px;
  margin:0 auto 28px;
  opacity:0.9;
}

.leaf{
  width:82px;
  height:82px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f7ea;
  border:1px solid var(--borda);
  box-shadow:0 8px 18px rgba(0,0,0,0.05);
}

.leaf svg{
  width:38px;
  height:38px;
  stroke:var(--verde);
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.actions{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  text-decoration:none;
  border-radius:14px;
  padding:13px 20px;
  font-weight:600;
  transition:all 0.25s ease;
}

.btn-primary{
  background:var(--verde);
  color:var(--fundo);
  border:2px solid var(--verde);
}

.btn-primary:hover{
  opacity:0.92;
  transform:translateY(-2px);
}

.btn-secondary{
  color:var(--verde);
  border:2px solid var(--verde);
  background:transparent;
}

.btn-secondary:hover{
  background:var(--verde);
  color:var(--fundo);
}

.note{
  margin-top:22px;
  font-size:14px;
  opacity:0.72;
}

/* RESPONSIVO */

@media (max-width:700px){

  .topbar{
    padding:20px;
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
  }

  .wrapper{
    padding:20px 16px 40px;
    min-height:auto;
  }

  .card{
    padding:34px 22px;
    border-radius:22px;
  }

  .text{
    font-size:16px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
    text-align:center;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Aves da Amazónia</div>

  <div class="nav">
    <a class="link" href="index.html">Início</a>
    <a class="link" href="explorar.html">Explorar</a>
    <a class="btn-top" href="explorar.html">← Voltar</a>
  </div>
</div>

<div class="wrapper">
  <div class="card">
    <div class="leaf" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 19c6.5 0 11-4 13-10 1-2.7 1-4 1-4s-1.3 0-4 1C9 8 5 12.5 5 19z"/>
        <path d="M5 19c1.5-3 4-5.5 8-8"/>
      </svg>
    </div>

    <div class="badge">Em desenvolvimento</div>

    <h1 class="title">Disponível em breve</h1>

    <p class="text">
      Esta página estará disponível em breve. A ave já faz parte da galeria, mas o conteúdo científico e artístico ainda está em preparação.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="explorar.html">Voltar à galeria</a>
      <a class="btn btn-secondary" href="index.html">Ir para o início</a>
    </div>

    <div class="note">
      Projeto académico em desenvolvimento.
    </div>
  </div>
</div>

</body>
</html>
