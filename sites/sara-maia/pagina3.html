<!DOCTYPE html>
<html>
<head>
    <title>SOUL?</title>
    <!-- Importar a fonte Pixelify Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .circle-animation {
            position: absolute;
            width: auto;
            height: auto;
            object-fit: contain;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .circle-animation:nth-child(odd) {
            opacity: 0.6;
        }
        
        .circle-animation:nth-child(3n) {
            opacity: 1;
        }
        
        .circle-animation:nth-child(5n+2) {
            opacity: 0.4;
        }

        /* Container do botão - cobre a página toda para permitir movimento */
        .button-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* Estilo do botão - VERSÃO FUGITIVA */
        .image-button {
            width: 200px;
            height: auto;
            cursor: pointer;
            opacity: 1;
            display: block;
            position: absolute;
            transition: transform 0.2s ease;
            pointer-events: auto;
            z-index: 1001;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        /* Efeito quando o rato está por cima (antes de fugir) */
        .image-button:hover {
            transform: scale(1.1);
        }

        /* Estilo do timer */
.timer {
    position: fixed;
    top: 20px;
    right: 675px;
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 30px;
    color: red;
    text-shadow: 0 0 10px rgba(255,0,0,0.5);
    z-index: 2000;
    background-color: rgba(0,0,0,0.5);
    padding: 5px 30px;
    border-radius: 10px;
    border: 2px solid red;
    letter-spacing: 2px;
    transition: all 0.3s ease;
}

/* Quando está a acabar (últimos 5 segundos) - EFEITO DE BRILHO */
.timer.warning {
    border-color: red;
    box-shadow: 0 0 20px red, 0 0 40px red, 0 0 60px red;
    text-shadow: 0 0 20px red, 0 0 40px red;
    animation: glow 1s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        box-shadow: 0 0 10px red, 0 0 20px red, 0 0 30px red;
        text-shadow: 0 0 10px red, 0 0 20px red;
    }
    to {
        box-shadow: 0 0 20px red, 0 0 40px red, 0 0 60px red, 0 0 80px red;
        text-shadow: 0 0 20px red, 0 0 40px red, 0 0 60px red;
    }
}
    </style>
</head>

<body>
    <!-- Timer de 15 segundos -->
    <div class="timer" id="timer">15</div>

    <!-- Botão que foge do rato -->
    <div class="button-container">
        <img src="imagens/popup2.png" alt="Botão" class="image-button" id="actionButton">
    </div>

    <script>
        // Synapse animation frames (27 frames de círculo)
        const synapseFrames = [];
        for (let i = 1; i <= 27; i++) {
            synapseFrames.push(`imagens/circleframe${i}.png`);
        }
        
        // Número de círculos
        const numCircles = 20;
        
        // Array para guardar os intervals de cada animação
        const animations = [];
        
        // Array para guardar os elementos img
        const circleImages = [];
        
        // Função para gerar tamanho aleatório entre min e max
        function randomSize(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        
        // Função para gerar posição aleatória
        function randomPosition(max) {
            return Math.floor(Math.random() * max);
        }
        
        // Função para reposicionar um círculo num local aleatório
        function repositionCircle(img) {
            const size = parseInt(img.style.width) || randomSize(50, 300);
            img.style.left = `${randomPosition(window.innerWidth - size)}px`;
            img.style.top = `${randomPosition(window.innerHeight - size)}px`;
            
            // Opcional: rodar aleatoriamente também
            img.style.transform = `rotate(${randomSize(0, 360)}deg)`;
        }
        
        // Função para criar um elemento de animação
        function createCircleAnimation(index) {
            // Criar elemento img
            const img = document.createElement('img');
            img.className = 'circle-animation';
            img.id = `circle-${index}`;
            img.src = synapseFrames[0];
            img.alt = `Circle Animation ${index}`;
            
            // Tamanho aleatório entre 50px e 300px
            const size = randomSize(50, 300);
            img.style.width = `${size}px`;
            
            // Posição aleatória inicial
            img.style.left = `${randomPosition(window.innerWidth - size)}px`;
            img.style.top = `${randomPosition(window.innerHeight - size)}px`;
            
            // Rotação aleatória
            img.style.transform = `rotate(${randomSize(0, 360)}deg)`;
            
            // Guardar o tamanho como atributo para uso futuro
            img.dataset.size = size;
            
            // Adicionar ao body
            document.body.appendChild(img);
            
            return img;
        }
        
        // Função para animar um círculo (vai e volta)
        function animateCircle(img, speed) {
            let frame = 0;
            let direction = 1; // 1 = forward, -1 = backward
            
            return setInterval(function() {
                // Atualizar frame na direção atual
                frame += direction;
                
                // Verificar se chegou ao fim do ciclo de volta (frame 0)
                if (frame === 0 && direction === -1) {
                    // Completou um ciclo: frame 27 → 1
                    // Reposicionar em local aleatório
                    repositionCircle(img);
                }
                
                // Mudar direção quando chegar aos extremos
                if (frame >= synapseFrames.length - 1) {
                    direction = -1; // Começa a voltar
                } else if (frame <= 0) {
                    direction = 1; // Começa a ir para a frente
                }
                
                // Atualizar imagem
                img.src = synapseFrames[frame];
                
            }, speed);
        }
        
        // Função para limpar e recriar tudo (usada no redimensionamento)
        function recreateAnimations() {
            // Parar todas as animações
            animations.forEach(id => clearInterval(id));
            
            // Limpar array de animações
            animations.length = 0;
            
            // Limpar body (mas manter o botão!)
            const buttonContainer = document.querySelector('.button-container');
            const timer = document.getElementById('timer');
            document.body.innerHTML = '';
            document.body.appendChild(buttonContainer);
            document.body.appendChild(timer);
            
            // Criar e animar todos os círculos novamente
            for (let i = 0; i < numCircles; i++) {
                const circleImg = createCircleAnimation(i);
                circleImages[i] = circleImg;
                const speed = randomSize(30, 100);
                const intervalId = animateCircle(circleImg, speed);
                animations.push(intervalId);
            }
        }
        
        // Criar e animar todos os círculos
        window.onload = function() {
            for (let i = 0; i < numCircles; i++) {
                // Criar elemento
                const circleImg = createCircleAnimation(i);
                circleImages[i] = circleImg;
                
                // Velocidade aleatória entre 30ms e 100ms
                const speed = randomSize(30, 100);
                
                // Começar animação
                const intervalId = animateCircle(circleImg, speed);
                animations.push(intervalId);
            }
            
            // Reorganizar se a janela for redimensionada
            window.addEventListener('resize', function() {
                recreateAnimations();
            });
    
            // ===== TIMER DE 15 SEGUNDOS =====
            let timeLeft = 15;
            const timerElement = document.getElementById('timer');
            let timerInterval = setInterval(function() {
                timeLeft--;
                timerElement.textContent = timeLeft;
                
                // Alerta visual quando faltam 5 segundos
                if (timeLeft <= 5) {
                    timerElement.classList.add('warning');
                }
                
                // Quando chega a 0, volta para o index
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    window.location.href = 'index.html';
                }
            }, 1000);
            
            // ===== BOTÃO QUE FUGE DO RATO =====
            const button = document.getElementById('actionButton');
            
            function getRandomPosition() {
                // Calcular limites (garantir que o botão fica sempre visível)
                const maxX = window.innerWidth - button.offsetWidth - 50;
                const maxY = window.innerHeight - button.offsetHeight - 100;
                
                // Garantir que não fica negativo
                const minX = 50;
                const minY = 50;
                
                const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
                const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
                
                return { x: randomX, y: randomY };
            }
            
            // Posição inicial no centro da parte de baixo
            const startX = (window.innerWidth / 2) - (button.offsetWidth / 2);
            const startY = window.innerHeight - button.offsetHeight - 50;
            
            button.style.left = startX + 'px';
            button.style.top = startY + 'px';
            
            // Quando o rato entra, o botão foge!
            button.addEventListener('mouseenter', function() {
                const { x, y } = getRandomPosition();
                this.style.left = x + 'px';
                this.style.top = y + 'px';
            });
            
            // ===== EVENTO DE CLIQUE =====
            button.addEventListener('click', function() {
                console.log('Botão clicado!');
                clearInterval(timerInterval); // Parar o timer
                window.location.href = 'pagina4.html'; // Abre página quando encurralado, na mesma janela
            });
            
            // Recalcular se a janela for redimensionada
            window.addEventListener('resize', function() {
                // Garantir que o botão não fica fora do ecrã
                const currentLeft = parseInt(button.style.left);
                const currentTop = parseInt(button.style.top);
                
                const maxX = window.innerWidth - button.offsetWidth - 20;
                const maxY = window.innerHeight - button.offsetHeight - 20;
                
                if (currentLeft > maxX) button.style.left = maxX + 'px';
                if (currentTop > maxY) button.style.top = maxY + 'px';
                if (currentLeft < 20) button.style.left = '20px';
                if (currentTop < 20) button.style.top = '20px';
            });
        };
    </script>
</body>
</html>
