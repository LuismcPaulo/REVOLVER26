<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Room - Pixel Reflection</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #room {
            position: relative;
            width: 80vw;
            height: 70vh;
            max-width: 900px;
            max-height: 600px;
            background: #000000;
            border: 6px solid #ffffff;
            box-shadow: 
                inset 8px 8px 0px rgba(255,255,255,0.1),
                inset -8px -8px 0px rgba(0,0,0,0.8);
            overflow: hidden;
            image-rendering: pixelated;
            will-change: transform;
        }

        #player {
            position: absolute;
            width: 32px;
            height: 32px;
            background: #ffffff;
            border: 3px solid #ffffff;
            z-index: 100;
            image-rendering: pixelated;
            background-image: 
                linear-gradient(#ffffff 2px, transparent 2px),
                linear-gradient(90deg, #ffffff 2px, transparent 2px);
            background-size: 8px 8px;
            box-shadow: 
                0 0 10px rgba(255,255,255,0.5),
                0 0 20px rgba(255,255,255,0.3);
        }

        #player::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 8px;
            height: 8px;
            background: #000000;
        }

        #player::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            background: #000000;
        }

        .critique-text {
            position: fixed;
            color: #ffffff;
            font-size: 0.5rem;
            text-shadow: 2px 2px 0 #000000;
            pointer-events: none;
            z-index: 50;
            animation: fadeIn 0.5s ease-out;
            max-width: 200px;
            line-height: 1.6;
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 0.9; transform: scale(1); }
        }

        .final-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff0000;
            font-size: 3rem;
            text-align: center;
            text-shadow: 
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 60px #ff0000;
            z-index: 500;
            animation: finalPulse 0.3s infinite;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            line-height: 1.5;
        }

        @keyframes finalPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .overload {
            animation: overloadPulse 0.5s infinite;
        }

        @keyframes overloadPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 200;
        }

        .hud-item {
            background: #000000;
            border: 4px solid #ffffff;
            padding: 10px 20px;
            color: #ffffff;
            font-size: 0.6rem;
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,0.2),
                inset -2px -2px 0px rgba(0,0,0,0.5),
                4px 4px 0px #000000;
        }

        .hud-item span {
            color: #ffffff;
        }

        .hud-item.danger {
            border-color: #ff0000;
            color: #ff0000;
        }

        .hud-item.danger span {
            color: #ff0000;
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            text-align: center;
        }

        #startScreen h1 {
            color: #ffffff;
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0 #000000;
        }

        #startScreen p {
            color: #ffffff;
            font-size: 0.5rem;
            margin: 10px 0;
            line-height: 2;
            max-width: 600px;
        }

        .pixel-btn {
            margin-top: 30px;
            padding: 15px 30px;
            background: #000000;
            border: 4px solid #ffffff;
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            cursor: pointer;
            box-shadow: 
                inset 3px 3px 0 rgba(255,255,255,0.3),
                inset -3px -3px 0 rgba(0,0,0,0.3),
                6px 6px 0 #000000;
            transition: transform 0.1s;
        }

        .pixel-btn:hover {
            transform: translate(3px, 3px);
            box-shadow: 
                inset 3px 3px 0 rgba(255,255,255,0.3),
                inset -3px -3px 0 rgba(0,0,0,0.3),
                3px 3px 0 #000000;
            background: #1a1a1a;
        }

        .pixel-btn:active {
            transform: translate(6px, 6px);
            box-shadow: none;
        }

        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #000000;
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 
                4px 4px 0px #000000,
                0 0 15px rgba(255, 255, 255, 0.3);
            transition: all 0.1s;
            z-index: 100;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .music-control:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
            background: #1a1a1a;
        }

        .music-control:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .music-control.muted {
            background: #333333;
        }

        #overloadOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 250;
            display: none;
            animation: overloadFlash 0.2s infinite;
        }

        @keyframes overloadFlash {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 600px) {
            #room {
                width: 90vw;
                height: 60vh;
            }
            #player {
                width: 24px;
                height: 24px;
            }
            .critique-text {
                font-size: 0.4rem;
            }
            #hud {
                flex-direction: column;
                gap: 10px;
            }
            .final-message {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="room.mp3" type="audio/mpeg">
        <source src="room.mp3" type="audio/ogg">
        Seu navegador não suporta áudio HTML5.
    </audio>

    <audio id="clickSound">
        <source src="clickit.mp3" type="audio/mpeg">
        <source src="clickit.mp3" type="audio/ogg">
        Seu navegador não suporta áudio HTML5.
    </audio>

    <div id="hud">
        <div class="hud-item">TIME: <span id="timerDisplay">30</span>s</div>
        <div class="hud-item">THOUGHTS: <span id="thoughtCount">0</span></div>
        <div class="hud-item">OVERLOAD: <span id="overloadPercent">0</span>%</div>
    </div>

    <div class="music-control" id="musicBtn" title="Mutar/Ativar música">
        🔊
    </div>

    <div id="overloadOverlay"></div>

    <div id="room">
        <div id="player"></div>
    </div>

    <div id="startScreen">
        <h1>🚪 THE ROOM</h1>
        <p>WASD to move</p>
        <p style="font-size:0.4rem;">"You have 30 seconds before reality returns."</p>
        <button class="pixel-btn" id="startBtn">ENTER THE ROOM</button>
    </div>

    <script>
        // ⚙️ CONFIGURAÇÃO GLOBAL - URL DO MENU
        const GAME_CONFIG = {
            MENU_URL: 'http://exp.pt/mm/cb'  // ✅ Altera só aqui se precisares!
        };

        const critiques = [
            "Why are you running?",
            "Time doesn't stop.",
            "What are you escaping from?",
            "The clock keeps ticking.",
            "You can't hide forever.",
            "Reality waits outside.",
            "Is this worth your time?",
            "Every second counts.",
            "You're just delaying.",
            "The problems remain.",
            "What's next?",
            "This won't last.",
            "Face it.",
            "No more distractions.",
            "Time's up soon.",
            "You know what you need to do.",
            "The escape is temporary.",
            "Life doesn't pause.",
            "What are you avoiding?",
            "The truth is waiting.",
            "You're running out of time.",
            "There's no exit.",
            "The thoughts multiply.",
            "You can't outrun yourself.",
            "OVERWHELMED.",
            "TOO MUCH.",
            "CAN'T BREATHE.",
            "SYSTEM OVERLOAD.",
            "RETURN TO REALITY."
        ];

        const CONFIG = {
            playerSpeed: 5,
            roomWidth: 0,
            roomHeight: 0,
            playerSize: 32,
            overloadThreshold: 100,
            thoughtsToOverload: 50,
            safeZone: 150,
            gameTime: 30,
            shakeStartTime: 20
        };

        let game = {
            running: false,
            playerX: 0,
            playerY: 0,
            thoughts: 0,
            overload: 0,
            timeLeft: CONFIG.gameTime,
            keys: { w: false, a: false, s: false, d: false },
            lastThoughtTime: 0,
            thoughtInterval: 800,
            existingThoughts: [],
            shakeIntensity: 0,
            musicVolume: 0.3 
        };

        const room = document.getElementById('room');
        const player = document.getElementById('player');
        const startScreen = document.getElementById('startScreen');
        const timerDisplayEl = document.getElementById('timerDisplay');
        const thoughtCountEl = document.getElementById('thoughtCount');
        const overloadPercentEl = document.getElementById('overloadPercent');
        const overloadOverlay = document.getElementById('overloadOverlay');
        const bgMusic = document.getElementById('bgMusic');
        const clickSound = document.getElementById('clickSound');
        const musicBtn = document.getElementById('musicBtn');

        let isMuted = false;
        let audioEnabled = false;
        let gameLoopId;
        let thoughtTimeout;
        let timerInterval;
        let shakeAnimationId;

        function enableAudio() {
            if (!audioEnabled) {
                bgMusic.volume = 0.3;
                bgMusic.play().catch(e => {
                    console.log('Autoplay bloqueado:', e);
                });
                audioEnabled = true;
                updateMusicIcon();
            }
        }

        function toggleMute() {
            playClickSound();
            enableAudio();
            isMuted = !isMuted;
            bgMusic.muted = isMuted;
            updateMusicIcon();
            localStorage.setItem('roomMusicMuted', isMuted);
        }

        function updateMusicIcon() {
            musicBtn.textContent = isMuted ? '🔇' : '🔊';
            musicBtn.classList.toggle('muted', isMuted);
        }

        function playClickSound() {
            if (clickSound) {
                clickSound.currentTime = 0;
                clickSound.volume = 0.4;
                clickSound.play().catch(e => console.log("Click sound failed:", e));
            }
        }

        function updateMusicVolume() {
            let newVolume = 0.3; 
            
            if (game.timeLeft <= 5) newVolume = 1.0;      
            else if (game.timeLeft <= 10) newVolume = 0.8; 
            else if (game.timeLeft <= 15) newVolume = 0.6; 
            else if (game.timeLeft <= 20) newVolume = 0.45; 
            
            if (newVolume > game.musicVolume) {
                game.musicVolume = newVolume;
                
                if (!isMuted && bgMusic) {
                    bgMusic.volume = game.musicVolume;
                }
            }
        }

        function applyShake() {
            if (game.timeLeft < 0) return;
            
            updateMusicVolume();
            
            let newIntensity = 0;
            if (game.timeLeft <= 5) newIntensity = 40;
            else if (game.timeLeft <= 10) newIntensity = 30;
            else if (game.timeLeft <= 15) newIntensity = 20;
            else if (game.timeLeft <= 20) newIntensity = 10;
            
            if (newIntensity > game.shakeIntensity) {
                game.shakeIntensity = newIntensity;
            }
            
            if (game.shakeIntensity > 0) {
                const time = Date.now() / 50;
                const x = Math.sin(time) * game.shakeIntensity;
                const y = Math.cos(time * 0.7) * game.shakeIntensity * 0.7;
                room.style.transform = `translate(${x}px, ${y}px)`;
            }
            
            shakeAnimationId = requestAnimationFrame(applyShake);
        }

        function startGame() {
            playClickSound();
            enableAudio();

            game = {
                running: true,
                playerX: CONFIG.roomWidth / 2 - CONFIG.playerSize / 2,
                playerY: CONFIG.roomHeight / 2 - CONFIG.playerSize / 2,
                thoughts: 0,
                overload: 0,
                timeLeft: CONFIG.gameTime,
                keys: { w: false, a: false, s: false, d: false },
                lastThoughtTime: Date.now(),
                thoughtInterval: 800,
                existingThoughts: [],
                shakeIntensity: 0,
                musicVolume: 0.3 
            };

            document.querySelectorAll('.critique-text').forEach(el => el.remove());
            document.querySelectorAll('.final-message').forEach(el => el.remove());
            game.existingThoughts = [];
            
            room.style.transform = '';
            startScreen.style.display = 'none';
            overloadOverlay.style.display = 'none';
            timerDisplayEl.parentElement.classList.remove('danger');
            
            updatePlayerPosition();
            updateHUD();
            
            gameLoopId = requestAnimationFrame(gameLoop);
            scheduleNextThought();
            startTimer();
            
            cancelAnimationFrame(shakeAnimationId);
            applyShake();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (game.timeLeft > 0) {
                    game.timeLeft--;
                    timerDisplayEl.textContent = game.timeLeft;
                    
                    if (game.timeLeft <= 10) {
                        timerDisplayEl.parentElement.classList.add('danger');
                    }
                    
                    if (game.timeLeft === 0) {
                        triggerTimeUp();
                    }
                }
            }, 1000);
        }

        function gameLoop() {
            if (!game.running) return;

            if (game.keys.w && game.playerY > 0) {
                game.playerY -= CONFIG.playerSpeed;
            }
            if (game.keys.s && game.playerY < CONFIG.roomHeight - CONFIG.playerSize) {
                game.playerY += CONFIG.playerSpeed;
            }
            if (game.keys.a && game.playerX > 0) {
                game.playerX -= CONFIG.playerSpeed;
            }
            if (game.keys.d && game.playerX < CONFIG.roomWidth - CONFIG.playerSize) {
                game.playerX += CONFIG.playerSpeed;
            }

            updatePlayerPosition();
            checkOverload();

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function updatePlayerPosition() {
            player.style.left = game.playerX + 'px';
            player.style.top = game.playerY + 'px';
        }

        function scheduleNextThought() {
            if (game.timeLeft < 0) return;

            const now = Date.now();
            if (now - game.lastThoughtTime >= game.thoughtInterval) {
                spawnThought();
                game.lastThoughtTime = now;
                game.thoughtInterval = Math.max(100, 800 - (game.thoughts * 15));
            }

            thoughtTimeout = setTimeout(scheduleNextThought, 50);
        }

        function isPositionSafe(x, y) {
            const playerRect = player.getBoundingClientRect();
            const safeX = playerRect.left - CONFIG.safeZone;
            const safeY = playerRect.top - CONFIG.safeZone;
            const safeWidth = playerRect.width + (CONFIG.safeZone * 2);
            const safeHeight = playerRect.height + (CONFIG.safeZone * 2);

            if (x < safeX + safeWidth &&
                x + 150 > safeX &&
                y < safeY + safeHeight &&
                y + 30 > safeY) {
                return false;
            }

            for (let thought of game.existingThoughts) {
                if (Math.abs(x - thought.x) < 100 && Math.abs(y - thought.y) < 30) {
                    return false;
                }
            }

            return true;
        }

        function spawnThought() {
            if (game.thoughts >= CONFIG.thoughtsToOverload) {
                triggerOverload();
                return;
            }

            let x, y, attempts = 0;
            do {
                x = Math.random() * window.innerWidth;
                y = Math.random() * window.innerHeight;
                attempts++;
            } while (!isPositionSafe(x, y) && attempts < 10);

            if (attempts >= 10) {
                x = Math.random() * window.innerWidth;
                y = Math.random() * window.innerHeight;
            }

            const thought = document.createElement('div');
            thought.className = 'critique-text';
            
            const progress = game.thoughts / CONFIG.thoughtsToOverload;
            const index = Math.floor(progress * critiques.length);
            thought.textContent = critiques[Math.min(index, critiques.length - 1)];
            
            thought.style.left = x + 'px';
            thought.style.top = y + 'px';
            
            const rotation = (Math.random() - 0.5) * 20;
            thought.style.transform = `rotate(${rotation}deg)`;
            
            document.body.appendChild(thought);
            
            game.existingThoughts.push({ x, y, element: thought });
            
            game.thoughts++;
            game.overload = Math.floor((game.thoughts / CONFIG.thoughtsToOverload) * 100);
            
            updateHUD();
        }

        function updateHUD() {
            timerDisplayEl.textContent = game.timeLeft;
            thoughtCountEl.textContent = game.thoughts;
            overloadPercentEl.textContent = game.overload;
            
            if (game.overload >= 70) {
                overloadPercentEl.parentElement.classList.add('danger');
            }
        }

        function checkOverload() {
            if (game.overload >= 50) {
                room.classList.add('overload');
            }
            if (game.overload >= 80) {
                overloadOverlay.style.display = 'block';
            }
        }

        function triggerTimeUp() {
            game.running = false;
            cancelAnimationFrame(gameLoopId);
            clearTimeout(thoughtTimeout);
            clearInterval(timerInterval);
            
            if (!isMuted && bgMusic) {
                bgMusic.volume = 1.0;
            }
            
            room.style.animation = 'none';
            let finalShake = 0;
            const finalShakeLoop = setInterval(() => {
                finalShake += 0.4;
                const x = Math.sin(finalShake) * 50;
                const y = Math.cos(finalShake * 0.7) * 35;
                room.style.transform = `translate(${x}px, ${y}px)`;
            }, 16);
            
            const finalMessage = document.createElement('div');
            finalMessage.className = 'final-message';
            finalMessage.innerHTML = "TIME'S UP<br>RETURN TO REALITY";
            document.body.appendChild(finalMessage);
            
            setTimeout(() => {
                clearInterval(finalShakeLoop);
                cancelAnimationFrame(shakeAnimationId);
                localStorage.setItem('gameLevel_2', 'completed');
                localStorage.setItem('gameLevel_3', 'unlocked');
                // ✅ REDIRECIONAMENTO COM URL ABSOLUTO
                window.location.href = GAME_CONFIG.MENU_URL;
            }, 3000);
        }

        function triggerOverload() {
            game.running = false;
            cancelAnimationFrame(gameLoopId);
            clearTimeout(thoughtTimeout);
            clearInterval(timerInterval);
            
            if (!isMuted && bgMusic) {
                bgMusic.volume = 1.0;
            }
            
            room.style.animation = 'none';
            let finalShake = 0;
            const finalShakeLoop = setInterval(() => {
                finalShake += 0.4;
                const x = Math.sin(finalShake) * 50;
                const y = Math.cos(finalShake * 0.7) * 35;
                room.style.transform = `translate(${x}px, ${y}px)`;
            }, 16);
            
            const finalMessage = document.createElement('div');
            finalMessage.className = 'final-message';
            finalMessage.innerHTML = "RETURN TO REALITY";
            document.body.appendChild(finalMessage);
            
            setTimeout(() => {
                clearInterval(finalShakeLoop);
                cancelAnimationFrame(shakeAnimationId);
                localStorage.setItem('gameLevel_2', 'completed');
                localStorage.setItem('gameLevel_3', 'unlocked');
                // ✅ REDIRECIONAMENTO COM URL ABSOLUTO
                window.location.href = GAME_CONFIG.MENU_URL;
            }, 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') game.keys.w = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') game.keys.a = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') game.keys.s = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') game.keys.d = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') game.keys.w = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') game.keys.a = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') game.keys.s = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') game.keys.d = false;
        });

        room.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = room.getBoundingClientRect();
            const touchX = touch.clientX - rect.left;
            const touchY = touch.clientY - rect.top;
            
            if (touchY < game.playerY) game.keys.w = true;
            if (touchY > game.playerY) game.keys.s = true;
            if (touchX < game.playerX) game.keys.a = true;
            if (touchX > game.playerX) game.keys.d = true;
        });

        room.addEventListener('touchend', (e) => {
            e.preventDefault();
            game.keys.w = false;
            game.keys.a = false;
            game.keys.s = false;
            game.keys.d = false;
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        musicBtn.addEventListener('click', toggleMute);

        function resizeRoom() {
            CONFIG.roomWidth = room.clientWidth;
            CONFIG.roomHeight = room.clientHeight;
            CONFIG.playerSize = player.offsetWidth;
        }

        window.addEventListener('load', () => {
            resizeRoom();
            window.addEventListener('resize', resizeRoom);
            
            const savedMute = localStorage.getItem('roomMusicMuted');
            if (savedMute === 'true') {
                isMuted = true;
                bgMusic.muted = true;
            }
            updateMusicIcon();
        });

        window.addEventListener('beforeunload', () => {
            if (bgMusic) {
                bgMusic.pause();
            }
            if (clickSound) {
                clickSound.pause();
            }
        });
    </script>
</body>
</html>
